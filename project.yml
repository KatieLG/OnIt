name: Stackban
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Stackban:
    type: application
    platform: macOS
    sources:
      - path: Stackban
      - path: raycast
        type: folder
        buildPhase: resources
    info:
      path: Stackban/Resources/Info.plist
      properties:
        CFBundleDisplayName: Stackban
        CFBundleName: Stackban
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleURLTypes:
          - CFBundleURLName: com.example.stackban
            CFBundleURLSchemes:
              - stackban
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stackban
        PRODUCT_NAME: Stackban
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  StackbanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: StackbanTests
    dependencies:
      - target: Stackban
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stackban.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Stackban.app/Contents/MacOS/Stackban"

schemes:
  Stackban:
    build:
      targets:
        Stackban: all
        StackbanTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StackbanTests
