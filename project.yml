name: OnIt
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-" # sign to run locally

targets:
  OnIt:
    type: application
    platform: macOS
    sources: [OnIt]
    info:
      path: OnIt/Resources/Info.plist # generated
      properties:
        LSUIElement: true # menu bar app: no Dock icon until a window opens
        CFBundleURLTypes:
          - CFBundleURLName: com.example.onit
            CFBundleURLSchemes: [onit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.onit
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [OnItTests]

  OnItTests:
    type: bundle.unit-test
    platform: macOS
    sources: [OnItTests]
    dependencies:
      - target: OnIt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
